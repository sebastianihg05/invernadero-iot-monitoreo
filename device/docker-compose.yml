version: "3.8"

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    # Sin "ports": el broker solo es accesible desde los otros contenedores (red interna de Docker).
    restart: unless-stopped
    volumes:
      - ./mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf

  sensor-reader:
    build: ./sensor-reader
    container_name: sensor-reader
    depends_on:
      - broker
    restart: unless-stopped
    environment:
      - MODO_SIMULADO=false
      - MQTT_HOST=broker
      # Docker oculta /sys/firmware en contenedores sin privilegios y la libreria del sensor no logra
      # identificar la placa; se le indica el modelo para no usar "privileged".
      - BLINKA_FORCEBOARD=RASPBERRY_PI_4B
      - BLINKA_FORCECHIP=BCM2XXX
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/gpiochip0:/dev/gpiochip0"

  data-processor:
    build: ./data-processor
    container_name: data-processor
    depends_on:
      - broker
    restart: unless-stopped
    environment:
      - MQTT_HOST=broker
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
    # RPi.GPIO (buzzer) necesita leer el modelo de la placa en /sys/firmware, que Docker oculta;
    # esta opcion lo deja visible sin dar modo privilegiado.
    security_opt:
      - systempaths=unconfined

  uploader:
    build: ./uploader
    container_name: uploader
    depends_on:
      - broker
    restart: unless-stopped
    environment:
      - MQTT_HOST=broker
      # Se leen del archivo .env (junto a este docker-compose.yml). NUNCA se escriben aqui.
      - API_URL=${API_URL:-}
      - DEVICE_TOKEN=${DEVICE_TOKEN:-}
      - CONFIG_URL=${CONFIG_URL:-}
      - SQLITE_PATH=/app/datos/sincronizacion.db
    volumes:
      # Buffer SQLite: sobrevive a reinicios y a "docker compose up --build"
      - uploader-datos:/app/datos

volumes:
  uploader-datos:
